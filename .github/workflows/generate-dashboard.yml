name: Generate Weekly Dashboard

on:
  schedule:
    - cron: '30 12 * * 3'  # Every Wednesday at 8:30am ET (12:30pm UTC)
  workflow_dispatch:         # Also runnable manually from the Actions tab

permissions:
  contents: write            # Needs to commit the generated HTML back to the repo

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dashboard HTML
        env:
          JIRA_EMAIL:      ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN:  ${{ secrets.JIRA_API_TOKEN }}
          JIRA_INSTANCE:   learningaz.atlassian.net
        run: python scripts/generate_dashboard.py

      - name: Commit generated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.html index.html
          git diff --cached --quiet || git commit -m "Weekly dashboard $(date +'%Y-%m-%d')"
          git push
